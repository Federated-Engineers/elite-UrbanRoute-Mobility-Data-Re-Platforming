version: 2

models:
  - name: dim_vehicles
    description: |
      Silver vehicle dimension containing vehicle inventory
      and lifecycle attributes.
    columns:
      - name: vehicle_id
        description: Unique vehicle identifier.
        data_tests:
          - not_null

      - name: vehicle_type
        description: Vehicle classification, such as Scooter or Bike.

      - name: hardware_version
        description: Vehicle hardware version.

      - name: deployment_date
        description: Vehicle deployment date.

      - name: current_status
        description: Current operational status.

